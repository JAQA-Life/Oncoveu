<style id="oncotics-workspace-styles">
/* ======================================================================
   Oncotics Precision Oncology Workspace: styles
   Everything is scoped under .oncotics-workspace. To adopt the global
   Oncotics design system, override the --ow-* custom properties below
   (e.g. set --ow-navy / --ow-teal from the site theme). No resets leak
   outside the workspace root.
   ====================================================================== */
.oncotics-workspace {
  --ow-navy: #0B2545;
  --ow-navy-2: #13315C;
  --ow-teal: #14B8A6;
  --ow-teal-ink: #0F766E;
  --ow-teal-soft: rgba(20,184,166,.12);
  --ow-bg: #F8FAFC;
  --ow-surface: #FFFFFF;
  --ow-surface-2: #F1F5F9;
  --ow-surface-3: #E2E8F0;
  --ow-border: #E2E8F0;
  --ow-border-strong: #CBD5E1;
  --ow-text: #0F172A;
  --ow-muted: #475569;
  --ow-subtle: #64748B;
  --ow-focus: #0EA5E9;
  --ow-shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
  --ow-shadow-lg: 0 20px 50px rgba(11,37,69,.22);
  --ow-radius: 12px;
  --ow-radius-sm: 8px;
  --ow-gene: #4338CA;   --ow-gene-bg: rgba(79,70,229,.10);
  --ow-variant: #0369A1; --ow-variant-bg: rgba(2,132,199,.10);
  --ow-protein: #6D28D9; --ow-protein-bg: rgba(124,58,237,.10);
  --ow-good: #047857;   --ow-good-bg: rgba(5,150,105,.11);
  --ow-warn: #92400E;   --ow-warn-bg: rgba(245,158,11,.16);
  --ow-bad: #BE123C;    --ow-bad-bg: rgba(225,29,72,.10);
  --ow-neutral: #334155; --ow-neutral-bg: rgba(100,116,139,.13);
  --ow-lit: #9A3412;    --ow-lit-bg: rgba(234,88,12,.11);
  --ow-device: #7E22CE; --ow-device-bg: rgba(147,51,234,.10);
  --ow-cyan: #0E7490;   --ow-cyan-bg: rgba(6,182,212,.12);
  --ow-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --ow-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --ow-pad: 16px;
  --ow-gap: 12px;
  color: var(--ow-text);
  background: var(--ow-bg);
  font-family: var(--ow-font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: block;
  min-height: 100vh;
  position: relative;
  text-align: left;
}
.oncotics-workspace[data-theme="dark"] {
  --ow-bg: #0A1424; --ow-surface: #0F1D33; --ow-surface-2: #142540; --ow-surface-3: #1C3050;
  --ow-border: #1F3456; --ow-border-strong: #2C4670; --ow-text: #E6EDF7; --ow-muted: #A9B8CE; --ow-subtle: #8FA2BD;
  --ow-teal-ink: #2DD4BF; --ow-teal-soft: rgba(45,212,191,.14); --ow-focus: #38BDF8;
  --ow-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); --ow-shadow-lg: 0 20px 50px rgba(0,0,0,.55);
  --ow-gene: #A5B4FC; --ow-gene-bg: rgba(129,140,248,.16); --ow-variant: #7DD3FC; --ow-variant-bg: rgba(56,189,248,.14);
  --ow-protein: #C4B5FD; --ow-protein-bg: rgba(167,139,250,.16); --ow-good: #6EE7B7; --ow-good-bg: rgba(52,211,153,.14);
  --ow-warn: #FCD34D; --ow-warn-bg: rgba(251,191,36,.14); --ow-bad: #FDA4AF; --ow-bad-bg: rgba(251,113,133,.15);
  --ow-neutral: #CBD5E1; --ow-neutral-bg: rgba(148,163,184,.16); --ow-lit: #FDBA74; --ow-lit-bg: rgba(251,146,60,.15);
  --ow-device: #D8B4FE; --ow-device-bg: rgba(192,132,252,.16); --ow-cyan: #67E8F9; --ow-cyan-bg: rgba(34,211,238,.14);
}
@media (prefers-color-scheme: dark) {
  .oncotics-workspace:not([data-theme="light"]) {
    --ow-bg: #0A1424; --ow-surface: #0F1D33; --ow-surface-2: #142540; --ow-surface-3: #1C3050;
    --ow-border: #1F3456; --ow-border-strong: #2C4670; --ow-text: #E6EDF7; --ow-muted: #A9B8CE; --ow-subtle: #8FA2BD;
    --ow-teal-ink: #2DD4BF; --ow-teal-soft: rgba(45,212,191,.14); --ow-focus: #38BDF8;
    --ow-shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); --ow-shadow-lg: 0 20px 50px rgba(0,0,0,.55);
    --ow-gene: #A5B4FC; --ow-gene-bg: rgba(129,140,248,.16); --ow-variant: #7DD3FC; --ow-variant-bg: rgba(56,189,248,.14);
    --ow-protein: #C4B5FD; --ow-protein-bg: rgba(167,139,250,.16); --ow-good: #6EE7B7; --ow-good-bg: rgba(52,211,153,.14);
    --ow-warn: #FCD34D; --ow-warn-bg: rgba(251,191,36,.14); --ow-bad: #FDA4AF; --ow-bad-bg: rgba(251,113,133,.15);
    --ow-neutral: #CBD5E1; --ow-neutral-bg: rgba(148,163,184,.16); --ow-lit: #FDBA74; --ow-lit-bg: rgba(251,146,60,.15);
    --ow-device: #D8B4FE; --ow-device-bg: rgba(192,132,252,.16); --ow-cyan: #67E8F9; --ow-cyan-bg: rgba(34,211,238,.14);
  }
}
.oncotics-workspace.ow-compact { --ow-pad: 10px; --ow-gap: 8px; font-size: 14px; }
.oncotics-workspace *, .oncotics-workspace *::before, .oncotics-workspace *::after { box-sizing: border-box; }
.oncotics-workspace h1, .oncotics-workspace h2, .oncotics-workspace h3, .oncotics-workspace h4, .oncotics-workspace p, .oncotics-workspace ul, .oncotics-workspace ol, .oncotics-workspace dl, .oncotics-workspace figure { margin: 0; }
.oncotics-workspace ul, .oncotics-workspace ol { padding-left: 1.2em; }
.oncotics-workspace h1 { font-size: 1.35rem; line-height: 1.25; letter-spacing: -.01em; font-weight: 700; }
.oncotics-workspace h2 { font-size: 1.15rem; line-height: 1.3; font-weight: 700; letter-spacing: -.005em; }
.oncotics-workspace h3 { font-size: 1rem; font-weight: 650; line-height: 1.35; }
.oncotics-workspace h4 { font-size: .9rem; font-weight: 650; color: var(--ow-muted); text-transform: uppercase; letter-spacing: .04em; }
.oncotics-workspace a { color: var(--ow-teal-ink); text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.oncotics-workspace a:hover { text-decoration-thickness: 2px; }
.oncotics-workspace code, .oncotics-workspace .ow-mono { font-family: var(--ow-mono); font-size: .86em; }
.oncotics-workspace :focus-visible { outline: 3px solid var(--ow-focus); outline-offset: 2px; border-radius: 6px; }
.oncotics-workspace .ow-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.oncotics-workspace .ow-skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--ow-navy); color: #fff; padding: 10px 14px; border-radius: 8px; text-decoration: none; }
.oncotics-workspace .ow-skip:focus { top: 8px; }
.oncotics-workspace [hidden] { display: none !important; }
.oncotics-workspace .ow-break { overflow-wrap: anywhere; word-break: break-word; }
.oncotics-workspace svg { flex: none; }
.oncotics-workspace .ow-ico { width: 18px; height: 18px; display: inline-block; vertical-align: -4px; }

/* ---------- Buttons & inputs ---------- */
.oncotics-workspace .ow-btn {
  font: inherit; font-size: .9rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--ow-border-strong);
  background: var(--ow-surface); color: var(--ow-text); cursor: pointer; text-decoration: none; line-height: 1.2; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
.oncotics-workspace .ow-btn:hover { background: var(--ow-surface-2); border-color: var(--ow-subtle); }
.oncotics-workspace .ow-btn[disabled], .oncotics-workspace .ow-btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
.oncotics-workspace .ow-btn-primary { background: var(--ow-teal-ink); border-color: var(--ow-teal-ink); color: #fff; }
.oncotics-workspace[data-theme="dark"] .ow-btn-primary { color: #04201D; }
@media (prefers-color-scheme: dark) { .oncotics-workspace:not([data-theme="light"]) .ow-btn-primary { color: #04201D; } }
.oncotics-workspace .ow-btn-primary:hover { background: var(--ow-navy); border-color: var(--ow-navy); color: #fff; }
.oncotics-workspace .ow-btn-ghost { background: transparent; border-color: transparent; }
.oncotics-workspace .ow-btn-ghost:hover { background: var(--ow-surface-2); border-color: var(--ow-border); }
.oncotics-workspace .ow-btn-sm { min-height: 32px; padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
.oncotics-workspace .ow-btn-icon { width: 40px; padding: 0; }
.oncotics-workspace .ow-btn-danger { color: var(--ow-bad); }
.oncotics-workspace .ow-input, .oncotics-workspace .ow-select, .oncotics-workspace textarea.ow-input {
  font: inherit; font-size: .92rem; color: var(--ow-text); background: var(--ow-surface); border: 1px solid var(--ow-border-strong);
  border-radius: 10px; min-height: 40px; padding: 8px 12px; width: 100%; min-width: 0;
}
.oncotics-workspace .ow-select { padding-right: 28px; }
.oncotics-workspace .ow-input::placeholder { color: var(--ow-subtle); }
.oncotics-workspace label.ow-label { display: block; font-size: .8rem; font-weight: 600; color: var(--ow-muted); margin-bottom: 4px; }
.oncotics-workspace .ow-field { display: flex; flex-direction: column; min-width: 0; }
.oncotics-workspace .ow-check { display: inline-flex; gap: 8px; align-items: center; font-size: .88rem; min-height: 32px; cursor: pointer; }
.oncotics-workspace .ow-check input { width: 18px; height: 18px; accent-color: var(--ow-teal-ink); }

/* ---------- Header ---------- */
.oncotics-workspace .ow-header { background: var(--ow-navy); color: #E7F0FA; padding: 14px var(--ow-pad) 18px; }
.oncotics-workspace .ow-header a { color: #9FF3E6; }
.oncotics-workspace .ow-header-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; max-width: 1560px; margin: 0 auto; }
.oncotics-workspace .ow-brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.oncotics-workspace .ow-logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; color: #fff; }
.oncotics-workspace .ow-logo-mark { width: 30px; height: 30px; }
.oncotics-workspace .ow-brand-text { min-width: 0; }
.oncotics-workspace .ow-brand-text h1 { color: #fff; font-size: 1.15rem; }
.oncotics-workspace .ow-tagline { color: #B6C7DD; font-size: .85rem; }
.oncotics-workspace .ow-header-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.oncotics-workspace .ow-header .ow-btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #F1F6FC; }
.oncotics-workspace .ow-header .ow-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); }
.oncotics-workspace .ow-privacy-badge { display: inline-flex; gap: 8px; align-items: flex-start; font-size: .8rem; color: #CFFAF3; background: rgba(20,184,166,.14); border: 1px solid rgba(45,212,191,.35); padding: 6px 10px; border-radius: 10px; max-width: 640px; line-height: 1.35; }
.oncotics-workspace .ow-search-wrap { max-width: 1560px; margin: 14px auto 0; }
.oncotics-workspace .ow-search { display: flex; gap: 8px; align-items: stretch; background: #fff; border-radius: 14px; padding: 6px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.oncotics-workspace .ow-search .ow-input { border: 0; font-size: 1.02rem; min-height: 48px; color: #0F172A; background: #fff; }
.oncotics-workspace .ow-search .ow-input:focus-visible { outline-offset: 0; }
.oncotics-workspace .ow-search .ow-btn-primary { min-height: 48px; padding: 0 22px; font-size: 1rem; background: var(--ow-teal-ink); border-color: var(--ow-teal-ink); color: #fff; }
.oncotics-workspace .ow-search .ow-btn-primary:hover { background: var(--ow-navy); }
.oncotics-workspace .ow-search-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: .8rem; color: #B6C7DD; }
.oncotics-workspace .ow-phi-warning { color: #FDE68A; }
.oncotics-workspace .ow-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.oncotics-workspace .ow-pill { font: inherit; font-size: .8rem; min-height: 32px; padding: 4px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #E7F0FA; cursor: pointer; }
.oncotics-workspace .ow-pill:hover { background: rgba(255,255,255,.16); }
.oncotics-workspace .ow-input-error { margin-top: 8px; background: #FFF1F2; color: #9F1239; border: 1px solid #FECDD3; padding: 8px 12px; border-radius: 10px; font-size: .88rem; }

.oncotics-workspace.ow-has-query .ow-pills, .oncotics-workspace.ow-has-query #ow-q-help { display: none; }
@media (max-width: 1500px) { .oncotics-workspace .ow-status-hide-md { display: none !important; } }
/* ---------- Shell layout ---------- */
.oncotics-workspace .ow-shell { display: grid; grid-template-columns: 236px minmax(0,1fr); gap: 0; max-width: 1560px; margin: 0 auto; min-height: 60vh; }
.oncotics-workspace .ow-rail { border-right: 1px solid var(--ow-border); padding: 14px 10px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; }
.oncotics-workspace .ow-rail-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.oncotics-workspace .ow-tab { font: inherit; display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ow-muted); cursor: pointer; text-align: left; font-size: .9rem; font-weight: 550; min-height: 40px; }
.oncotics-workspace .ow-tab:hover { background: var(--ow-surface-2); color: var(--ow-text); }
.oncotics-workspace .ow-tab[aria-selected="true"] { background: var(--ow-teal-soft); color: var(--ow-text); border-color: rgba(20,184,166,.35); }
.oncotics-workspace .ow-tab .ow-count { margin-left: auto; font-size: .72rem; font-weight: 700; background: var(--ow-surface-3); color: var(--ow-muted); padding: 1px 7px; border-radius: 999px; }
.oncotics-workspace .ow-tab[aria-selected="true"] .ow-count { background: var(--ow-teal-ink); color: #fff; }
.oncotics-workspace .ow-rail-sep { height: 1px; background: var(--ow-border); margin: 8px 6px; }
.oncotics-workspace .ow-rail-legal { font-size: .72rem; color: var(--ow-subtle); padding: 8px; }
.oncotics-workspace .ow-main { padding: var(--ow-pad) calc(var(--ow-pad) + 4px) 90px; min-width: 0; }
.oncotics-workspace .ow-module-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 12px; }
.oncotics-workspace .ow-module-head p { color: var(--ow-muted); font-size: .9rem; margin-top: 2px; max-width: 820px; }
.oncotics-workspace .ow-toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ---------- Cards & panels ---------- */
.oncotics-workspace .ow-card { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: var(--ow-radius); padding: var(--ow-pad); box-shadow: var(--ow-shadow); min-width: 0; }
.oncotics-workspace .ow-card + .ow-card { margin-top: var(--ow-gap); }
.oncotics-workspace .ow-grid > .ow-card, .oncotics-workspace .ow-grid-2 > .ow-card, .oncotics-workspace .ow-grid-3 > .ow-card, .oncotics-workspace .ow-stack > .ow-card { margin-top: 0; }
.oncotics-workspace .ow-card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.oncotics-workspace .ow-card-title { font-weight: 650; font-size: 1rem; line-height: 1.35; overflow-wrap: anywhere; }
.oncotics-workspace .ow-card-title button.ow-linkbtn { font-weight: inherit; font-size: inherit; text-align: left; }
.oncotics-workspace .ow-card-sub { color: var(--ow-muted); font-size: .85rem; margin-top: 2px; overflow-wrap: anywhere; }
.oncotics-workspace .ow-card-body { margin-top: 8px; font-size: .9rem; color: var(--ow-text); overflow-wrap: anywhere; }
.oncotics-workspace .ow-card-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.oncotics-workspace .ow-grid { display: grid; gap: var(--ow-gap); grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }
.oncotics-workspace .ow-grid-2 { display: grid; gap: var(--ow-gap); grid-template-columns: repeat(2, minmax(0,1fr)); }
.oncotics-workspace .ow-grid-3 { display: grid; gap: var(--ow-gap); grid-template-columns: repeat(3, minmax(0,1fr)); }
.oncotics-workspace .ow-stack { display: flex; flex-direction: column; gap: var(--ow-gap); }
.oncotics-workspace .ow-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.oncotics-workspace .ow-spacer { flex: 1; }
.oncotics-workspace .ow-section { margin-top: 20px; }
.oncotics-workspace .ow-section > h3, .oncotics-workspace .ow-section-title { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.oncotics-workspace .ow-muted { color: var(--ow-muted); }
.oncotics-workspace .ow-subtle { color: var(--ow-subtle); font-size: .82rem; }
.oncotics-workspace .ow-small { font-size: .82rem; }
.oncotics-workspace .ow-linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--ow-teal-ink); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.oncotics-workspace .ow-kv { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0,1fr); gap: 6px 14px; font-size: .88rem; }
.oncotics-workspace .ow-kv dt { color: var(--ow-muted); font-weight: 600; }
.oncotics-workspace .ow-kv dd { margin: 0; overflow-wrap: anywhere; }
.oncotics-workspace .ow-stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.oncotics-workspace .ow-stat { background: var(--ow-surface); border: 1px solid var(--ow-border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.oncotics-workspace .ow-stat-num { font-size: 1.35rem; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }
.oncotics-workspace .ow-stat-label { font-size: .76rem; color: var(--ow-muted); margin-top: 3px; line-height: 1.3; }
.oncotics-workspace .ow-stat-src { font-size: .7rem; color: var(--ow-subtle); margin-top: 2px; }
.oncotics-workspace .ow-notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: .86rem; border: 1px solid var(--ow-border); background: var(--ow-surface-2); color: var(--ow-text); line-height: 1.45; }
.oncotics-workspace .ow-notice + .ow-notice { margin-top: 8px; }
.oncotics-workspace .ow-notice-warn { background: var(--ow-warn-bg); border-color: rgba(245,158,11,.35); }
.oncotics-workspace .ow-notice-bad { background: var(--ow-bad-bg); border-color: rgba(225,29,72,.3); }
.oncotics-workspace .ow-notice-info { background: var(--ow-variant-bg); border-color: rgba(2,132,199,.25); }
.oncotics-workspace .ow-notice-good { background: var(--ow-good-bg); border-color: rgba(5,150,105,.28); }
.oncotics-workspace .ow-notice strong { font-weight: 700; }
.oncotics-workspace .ow-disclaimer { font-size: .8rem; color: var(--ow-muted); border-left: 3px solid var(--ow-teal); padding: 6px 10px; background: var(--ow-surface-2); border-radius: 0 8px 8px 0; margin: 10px 0; }
.oncotics-workspace details.ow-details { border: 1px solid var(--ow-border); border-radius: 10px; background: var(--ow-surface); }
.oncotics-workspace details.ow-details + details.ow-details { margin-top: 6px; }
.oncotics-workspace details.ow-details > summary { cursor: pointer; padding: 10px 12px; font-weight: 600; font-size: .9rem; list-style: none; display: flex; gap: 8px; align-items: center; min-height: 40px; }
.oncotics-workspace details.ow-details > summary::-webkit-details-marker { display: none; }
.oncotics-workspace details.ow-details > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ow-muted); border-bottom: 2px solid var(--ow-muted); transform: rotate(-45deg); transition: transform .15s; flex: none; }
.oncotics-workspace details.ow-details[open] > summary::before { transform: rotate(45deg); }
.oncotics-workspace details.ow-details > .ow-details-body { padding: 0 12px 12px; font-size: .88rem; overflow-wrap: anywhere; }
.oncotics-workspace .ow-pre { white-space: pre-wrap; font-family: inherit; margin: 0; overflow-wrap: anywhere; }
.oncotics-workspace .ow-code { font-family: var(--ow-mono); font-size: .78rem; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--ow-surface-2); border: 1px solid var(--ow-border); padding: 10px; border-radius: 8px; max-height: 420px; overflow: auto; margin: 0; }
.oncotics-workspace .ow-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.oncotics-workspace .ow-clamp.ow-open { -webkit-line-clamp: unset; display: block; }

/* ---------- Badges ---------- */
