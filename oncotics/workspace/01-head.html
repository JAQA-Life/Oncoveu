  ======================================================================
  HOW TO EMBED ON ONCOTICS.COM
  ======================================================================
  The whole app lives inside <main id="oncotics-precision-workspace"> and
  one <style> + one <script> block. All CSS is scoped under
  .oncotics-workspace, so it will not restyle the host page.

  - Static hosting (recommended): upload this file as
    /precision-oncology-workspace/index.html (or /workspace/index.html).
    The <meta http-equiv="Content-Security-Policy"> below then limits
    network access to the public data providers only.
  - WordPress: add a "Custom HTML" block and paste everything from
    <style id="oncotics-workspace-styles"> to the closing </script>.
    (Page-level <head> tags such as the CSP and SEO meta must be set in
    your theme/SEO plugin instead.)
  - Webflow: Embed element (or page-level custom code, "before </body>").
  - Wix: "Embed HTML" (iframe). The iframe MUST allow-same-origin; a
    sandboxed iframe without it sends "Origin: null", which CIViC rejects
    with HTTP 422. Prefer static hosting.
  - Squarespace: Code block (Business plan or higher).

  Local preview: do NOT double-click the file (file:// sends Origin: null).
  Serve it instead:  python3 -m http.server 8000
  then open http://localhost:8000/oncotics-precision-workspace.html

  Nothing here uses cookies, localStorage, sessionStorage, IndexedDB,
  Cache Storage, service workers, analytics, external fonts or external
  scripts. The only same-origin script that may load is the optional
  self-hosted globe engine (/assets/globe/index.js).
