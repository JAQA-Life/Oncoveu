name: Oncotics AI model packs

# Builds the trained cancer AI model packs for the Oncotics Imaging Workbench:
# downloads the authors' official weights, converts them to ONNX, verifies the ONNX
# outputs against the original PyTorch models and publishes one zip artifact
# ("oncotics-ai-model-packs") whose folders go into public_html/assets/models/.
on:
  workflow_dispatch:
  push:
    branches: [claude/oncotics-precision-workspace-uuswkw]
    paths:
      - 'oncotics/ai/**'
      - 'oncotics/imaging/**'
      - '.github/workflows/oncotics-ai-models.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            oncotics/ai
            oncotics/imaging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch (CPU) and model libraries
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r oncotics/ai/requirements.txt
      - name: Build and verify model packs
        run: python oncotics/ai/build_model_packs.py --out dist/models
      - name: Summary
        run: |
          for f in dist/models/*/pack.json; do python -c "import json,sys; p=json.load(open('$f')); print(p['id'], round(p['sizeBytes']/1048576,1), 'MB', p['sha256'], p['verification'])"; done
          ls -la dist/models/*
      - uses: actions/upload-artifact@v4
        with:
          name: oncotics-ai-model-packs
          path: dist/models
          retention-days: 30
      # End-to-end: the real chest X-ray pack inside the built Imaging Workbench (headless Chromium)
      # must reproduce the official TorchXRayVision prediction for a public test X-ray.
      - name: Reference prediction for a public test chest X-ray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p e2e
          url=$(gh api repos/mlmed/torchxrayvision/contents/tests --jq '[.[] | select(.name|test("\\.(png|jpe?g)$";"i"))][0].download_url')
          echo "test image: $url"
          curl -fsSL -o "e2e/$(basename "$url")" "$url"
          echo "E2E_IMAGE=$PWD/e2e/$(basename "$url")" >> "$GITHUB_ENV"
          python oncotics/ai/reference_cxr.py "e2e/$(basename "$url")" | tee e2e/ref.json
      - name: Run the real model in the Imaging Workbench (Chromium)
        run: |
          mkdir -p oncotics/site/src && bash oncotics/imaging/build.sh
          mkdir -p web/imaging web/assets/ort
          cp oncotics/imaging/dist/oncotics-imaging-workbench.html web/imaging/index.html
          cp -r dist/models web/assets/models
          (cd e2e && npm pack onnxruntime-web@1.20.1 >/dev/null && tar xzf onnxruntime-web-1.20.1.tgz)
          for f in ort.wasm.min.mjs ort-wasm-simd-threaded.mjs ort-wasm-simd-threaded.wasm; do cp e2e/package/dist/$f web/assets/ort/; done
          (cd web && python -m http.server 8099 >/dev/null 2>&1 &)
          cd oncotics/ai && npm init -y >/dev/null && npm i --no-save playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          node e2e_workbench.mjs http://127.0.0.1:8099 "$E2E_IMAGE" ../../e2e/ref.json
      # End-to-end: the 3D packs in the Workbench (NIfTI upload, volume assembly, Web Worker inference)
      # must reproduce MONAI's own pipeline (LoadImage, NormalizeIntensity / Orientation, Spacing,
      # ScaleIntensityRange, sliding_window_inference, RetinaNetDetector) on synthetic volumes.
      - name: MONAI references for synthetic brain MRI and chest CT volumes
        run: |
          D=e2e/3d; M=dist/models
          python oncotics/ai/reference_3d.py data $D
          python oncotics/ai/reference_3d.py dicom $D/synthetic_chest_ct.nii.gz $D/ctdicom
          python oncotics/ai/reference_3d.py brain $M/brain-mri-brats-segresnet $D/synthetic_t1ce.nii.gz $D/synthetic_t1.nii.gz $D/synthetic_t2.nii.gz $D/synthetic_flair.nii.gz 0.5 > $D/brain_ref.json
          python oncotics/ai/reference_3d.py lung $M/lung-ct-luna16-retinanet $D/synthetic_chest_ct.nii.gz 0.001 > $D/lung_ref.json
          cat $D/brain_ref.json; python -c "import json; r = json.load(open('$D/lung_ref.json')); print(len(r['boxes']), 'boxes; top scores', r['scores'][:5])"
      - name: Run the 3D models in the Imaging Workbench (Chromium)
        run: |
          mkdir -p web3d/imaging && cp -r web/assets web3d/assets
          bash oncotics/ai/instrument_e2e.sh oncotics/imaging/dist/oncotics-imaging-workbench.html web3d/imaging/index.html
          (node oncotics/ai/e2e_server.mjs web3d 8098 >/dev/null 2>&1 &)
          sleep 2; cd oncotics/ai
          node e2e_workbench_3d.mjs http://127.0.0.1:8098 ../../e2e/3d ../../e2e/3d/brain_ref.json ../../e2e/3d/lung_ref.json 0.5 0.001 ../../e2e/3d/ctdicom
